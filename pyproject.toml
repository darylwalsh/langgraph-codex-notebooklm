[project]
name = "s1983-agents"
version = "0.1.0"
description = "LangGraph multi-agent pipeline for drafting and stress-testing a § 1983 prisoner civil rights complaint (E.D. Mich.)"
readme = "README.md"
authors = [
    { name = "Daryl", email = "daryl@datametal.io" }
]
requires-python = ">=3.13"
dependencies = [
    "eyecite>=2.7.8",
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "langchain[anthropic]>=1.4.3",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Point a role at another provider, e.g. S1983_MODEL_JUDGE=openai:<model>
openai = ["langchain[openai]>=1.4.3"]
google = ["langchain[google-genai]>=1.4.3"]

[project.scripts]
s1983 = "s1983_agents.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
